# HTTP (80) - редирект на HTTPS и Let's Encrypt challenge
server {
    listen 80;
    server_name ttschat.ru;

    # Для Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Редирект всего остального на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS (443) - фронтенд + API
server {
    listen 443 ssl;
    server_name ttschat.ru;

    # SSL сертификаты
    ssl_certificate     /etc/letsencrypt/live/ttschat.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ttschat.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Фронтенд (React build)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    # API → Flask (Gunicorn)
    location /api/ {
        proxy_pass http://backend:5001; # используем имя контейнера из docker-compose
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gzip для фронтенда
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 256;
}
